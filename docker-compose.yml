services:
  db:
    image: mariadb:10.6@sha256:8d0471f561aa2276615a1d8bfc7e88cde822ee08baa9700c03797dbfbc6bd6ff
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: ${DB_NAME:-erpnext}
      MARIADB_USER: ${DB_USER:-erpnext}
      MARIADB_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
  redis-cache:
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  redis-queue:
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  configurator:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    environment:
      PROCESS_ROLE: configurator
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
      DB_NAME: ${DB_NAME:-erpnext}
      DB_USER: ${DB_USER:-erpnext}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      CONFIGURATOR_RETRIES: ${CONFIGURATOR_RETRIES:-5}
      CONFIGURATOR_RETRY_DELAY: ${CONFIGURATOR_RETRY_DELAY:-10}
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
  web:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCESS_ROLE: web
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:8000 || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  socketio:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCESS_ROLE: socketio
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null "http://localhost:9000/socket.io/?EIO=4&transport=polling" || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  worker-default:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCESS_ROLE: worker-default
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 $(cat /tmp/bench-worker-default.pid 2>/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  worker-short:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCESS_ROLE: worker-short
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 $(cat /tmp/bench-worker-short.pid 2>/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  worker-long:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCESS_ROLE: worker-long
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 $(cat /tmp/bench-worker-long.pid 2>/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  scheduler:
    image: ${APP_IMAGE:-erpnext-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCESS_ROLE: scheduler
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 $(cat /tmp/bench-scheduler.pid 2>/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  nginx:
    image: nginx:alpine@sha256:35cd77497979abe70dc8d26f5ae60811eea233a2eb5dc03c2ee30972caeb303e
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - sites_data:/usr/share/nginx/sites:ro
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_HOST: web
      SOCKETIO_HOST: socketio
      SITE_NAME: ${SITE_NAME:-erp.saharapro.team}
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.erpnext-erp-rhpcwc-9-web.rule=Host(`erp.saharapro.team`)
      - traefik.http.routers.erpnext-erp-rhpcwc-9-web.entrypoints=web
      - traefik.http.services.erpnext-erp-rhpcwc-9-web.loadbalancer.server.port=80
      - traefik.http.routers.erpnext-erp-rhpcwc-9-web.service=erpnext-erp-rhpcwc-9-web
      - traefik.http.routers.erpnext-erp-rhpcwc-9-web.middlewares=redirect-to-https@file
      - traefik.http.routers.erpnext-erp-rhpcwc-9-websecure.rule=Host(`erp.saharapro.team`)
      - traefik.http.routers.erpnext-erp-rhpcwc-9-websecure.entrypoints=websecure
      - traefik.http.services.erpnext-erp-rhpcwc-9-websecure.loadbalancer.server.port=80
      - traefik.http.routers.erpnext-erp-rhpcwc-9-websecure.service=erpnext-erp-rhpcwc-9-websecure
      - traefik.http.routers.erpnext-erp-rhpcwc-9-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
    networks:
      - dokploy-network
      - default
volumes:
  db_data: null
  redis_cache_data: null
  redis_queue_data: null
  sites_data: null
networks:
  dokploy-network:
    external: true
